description = '''
Biomes Unseen is a total-conversion exploration mod.

140 hand-authored biomes across five Overworld categories, three new
dimensions, 44 ores with real uses, 10 gear families with set
bonuses, 80 creatures, 115 jigsaw structures and
5 multi-phase bosses.

Every texture is hand-authored pixel art. Every creature is a fully articulated
GeckoLib model. Every hostile has real targeting and melee AI.
'''

