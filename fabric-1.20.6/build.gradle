plugins {
    id "dev.architectury.loom" version "1.17.493"
    id "java"
}

base {
    archivesName = "biomesunseen-1.20.6-fabric"
}

// Shared content trees: core + this API line.
sourceSets.main.java.srcDirs += rootProject.file("common/src/main/java")
sourceSets.main.java.srcDirs += rootProject.file("common/src/line-1.20.5/java")
sourceSets.main.resources.srcDirs += rootProject.file("common/src/main/resources")
sourceSets.main.resources.srcDirs += rootProject.file("common/src/line-1.20.5/resources")
sourceSets.main.resources.srcDirs += "src/generated/resources"



dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "dev.architectury:architectury:${architectury_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// CI diagnostic: prints the resolved compile classpath so the exact Minecraft
// jar (and therefore the API surface) each module builds against is verifiable.
tasks.register("printCompileClasspath") {
    doLast {
        configurations.compileClasspath.files.each { f -> println("CP " + f.absolutePath) }
    }
}

tasks.register("runDatagen", JavaExec) {
    group = "biomesunseen"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "com.biomesunseen.datagen.DataGenerators"
    args = ["src/generated/resources"]
}
