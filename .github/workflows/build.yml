# Build Biomes Unseen (Minecraft 1.20.1 / Forge 47.x)
#
# Compiles the mod with ForgeGradle and uploads the resulting reobfuscated jar.
#
# The data-generator JSON (blockstates, models, lang, recipes, loot, tags) is
# produced deterministically by `tools/gen_all.py` -> gen_datagen_assets.py into
# src/generated/resources (a registered resource source dir, and the same path
# `runData` would target). We intentionally do NOT run `gradle runData` here:
# TerraBlender's MixinBuiltInRegistries targets an SRG method name that does not
# exist in the mapped dev/datagen runtime, so runData crashes during Bootstrap
# before any provider executes. Pre-generating the identical assets avoids that
# crash and makes the jar complete and the build reproducible.
#
# The jar and a short diagnostics file are committed back into the repo (dist/
# and ci-diagnostics.md) so they can be retrieved from environments that cannot
# reach Actions log/artifact blob storage. Those paths are in paths-ignore and
# the publish commit is tagged [skip ci], so publishing never re-triggers this
# workflow.

name: Build Biomes Unseen

on:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'ci-diagnostics.md'
      - 'dist/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate content and data-generator assets
        run: python tools/gen_all.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Build jar
        id: build
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log

      - name: Smoke-test a fresh dedicated server
        id: server_smoke
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'EOF'
          enable-rcon=true
          rcon.port=25575
          rcon.password=arena-smoke
          server-port=25566
          level-name=world
          EOF
          timeout --signal=TERM --kill-after=20s 300s gradle runServer --no-daemon > server-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 300); do
            if grep -Fq 'Done (' server-smoke.log; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat server-smoke.log; exit 1; fi
          grep -F 'Biomes Unseen worldgen ready' server-smoke.log
          RCON_PORT=25575 RCON_PASSWORD=arena-smoke python tools/server_smoke.py 2>&1 | tee -a server-smoke.log
          wait "$server_pid"
          trap - EXIT

      - name: Upload built jar (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biomesunseen-jar
          path: build/libs/*.jar
          if-no-files-found: warn

      - name: Publish results to repo
        if: always()
        run: |
          set +e
          {
            echo "# CI build results"
            echo
            echo "- build outcome: ${{ steps.build.outcome }}"
            echo "- dedicated-server smoke outcome: ${{ steps.server_smoke.outcome }}"
            echo
            echo "## build log (errors + tail)"
            echo '```'
            grep -n -A4 -E "error:|FAILURE:|What went wrong|Execution failed|Exception|Caused by" build.log 2>/dev/null | head -160
            echo '----- tail -----'
            tail -n 35 build.log 2>/dev/null
            echo '```'
            echo
            echo "## dedicated-server smoke log"
            echo '```'
            grep -n -A3 -E "worldgen ready|worldgen check FAILED|RCON|ERROR|Exception|Could not find|Unknown" server-smoke.log 2>/dev/null | tail -n 100
            echo '----- tail -----'
            tail -n 35 server-smoke.log 2>/dev/null
            echo '```'
            echo
            echo "## built jars"
            echo '```'
            ls -la build/libs 2>/dev/null
            echo '```'
          } > ci-diagnostics.md

          mkdir -p dist
          if [ "${{ steps.build.outcome }}" = "success" ] && [ "${{ steps.server_smoke.outcome }}" = "success" ]; then
            rm -f dist/*.jar
            for j in build/libs/*.jar; do
              if [ -f "$j" ]; then cp "$j" dist/; fi
            done
          else
            echo "Keeping the previous jar; build and server smoke test must both pass before publishing a replacement."
          fi
          ls -la dist 2>/dev/null

          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-diagnostics.md
          git add -f dist 2>/dev/null
          git commit -m "Publish CI results and jar [skip ci]" || echo "nothing to commit"
          git push || true
