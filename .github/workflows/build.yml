name: Build all targets

on:
  push:
    branches: ["arena/be9e6e99-biomes-unseen"]
  workflow_dispatch:

jobs:
  # Full-matrix API probe: for every target, dump the javap signature of the
  # Minecraft classes the generators touch and upload it as an artifact.  The
  # generator is then written against the real jar for each version instead of
  # against guesswork.
  probe:
    name: probe-${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        module:
          - "fabric-1.16.5"
          - "forge-1.16.5"
          - "fabric-1.17.1"
          - "forge-1.17.1"
          - "fabric-1.18.1"
          - "forge-1.18.1"
          - "fabric-1.18.2"
          - "forge-1.18.2"
          - "fabric-1.19"
          - "forge-1.19"
          - "fabric-1.19.1"
          - "forge-1.19.1"
          - "fabric-1.19.2"
          - "forge-1.19.2"
          - "fabric-1.19.3"
          - "forge-1.19.3"
          - "fabric-1.19.4"
          - "forge-1.19.4"
          - "fabric-1.20"
          - "forge-1.20"
          - "fabric-1.20.1"
          - "forge-1.20.1"
          - "fabric-1.20.2"
          - "neoforge-1.20.2"
          - "fabric-1.20.3"
          - "neoforge-1.20.3"
          - "fabric-1.20.4"
          - "neoforge-1.20.4"
          - "fabric-1.20.5"
          - "neoforge-1.20.5"
          - "fabric-1.20.6"
          - "neoforge-1.20.6"
          - "fabric-1.21"
          - "neoforge-1.21"
          - "fabric-1.21.1"
          - "neoforge-1.21.1"
          - "fabric-1.21.2"
          - "neoforge-1.21.2"
          - "fabric-1.21.3"
          - "neoforge-1.21.3"
          - "fabric-1.21.4"
          - "neoforge-1.21.4"
          - "fabric-1.21.5"
          - "neoforge-1.21.5"
          - "fabric-1.21.6"
          - "neoforge-1.21.6"
          - "fabric-1.21.7"
          - "neoforge-1.21.7"
          - "fabric-1.21.8"
          - "neoforge-1.21.8"
          - "fabric-1.21.9"
          - "neoforge-1.21.9"
          - "fabric-1.21.10"
          - "neoforge-1.21.10"
          - "fabric-1.21.11"
          - "neoforge-1.21.11"
          - "fabric-26.1"
          - "neoforge-26.1"
          - "fabric-26.1.1"
          - "neoforge-26.1.1"
          - "fabric-26.1.2"
          - "neoforge-26.1.2"
          - "fabric-26.2"
          - "neoforge-26.2"
          - "fabric-26.3"
          - "neoforge-26.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"
      - name: Dump API surface
        env:
          BIOMESUNSEEN_MODULE: ${{ matrix.module }}
        run: bash tools/ci_probe.sh "${{ matrix.module }}"
      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.module }}
          path: probe-*.txt
          if-no-files-found: error
  build:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        module:
          - "fabric-1.16.5"
          - "forge-1.16.5"
          - "fabric-1.17.1"
          - "forge-1.17.1"
          - "fabric-1.18.1"
          - "forge-1.18.1"
          - "fabric-1.18.2"
          - "forge-1.18.2"
          - "fabric-1.19"
          - "forge-1.19"
          - "fabric-1.19.1"
          - "forge-1.19.1"
          - "fabric-1.19.2"
          - "forge-1.19.2"
          - "fabric-1.19.3"
          - "forge-1.19.3"
          - "fabric-1.19.4"
          - "forge-1.19.4"
          - "fabric-1.20"
          - "forge-1.20"
          - "fabric-1.20.1"
          - "forge-1.20.1"
          - "fabric-1.20.2"
          - "neoforge-1.20.2"
          - "fabric-1.20.3"
          - "neoforge-1.20.3"
          - "fabric-1.20.4"
          - "neoforge-1.20.4"
          - "fabric-1.20.5"
          - "neoforge-1.20.5"
          - "fabric-1.20.6"
          - "neoforge-1.20.6"
          - "fabric-1.21"
          - "neoforge-1.21"
          - "fabric-1.21.1"
          - "neoforge-1.21.1"
          - "fabric-1.21.2"
          - "neoforge-1.21.2"
          - "fabric-1.21.3"
          - "neoforge-1.21.3"
          - "fabric-1.21.4"
          - "neoforge-1.21.4"
          - "fabric-1.21.5"
          - "neoforge-1.21.5"
          - "fabric-1.21.6"
          - "neoforge-1.21.6"
          - "fabric-1.21.7"
          - "neoforge-1.21.7"
          - "fabric-1.21.8"
          - "neoforge-1.21.8"
          - "fabric-1.21.9"
          - "neoforge-1.21.9"
          - "fabric-1.21.10"
          - "neoforge-1.21.10"
          - "fabric-1.21.11"
          - "neoforge-1.21.11"
          - "fabric-26.1"
          - "neoforge-26.1"
          - "fabric-26.1.1"
          - "neoforge-26.1.1"
          - "fabric-26.1.2"
          - "neoforge-26.1.2"
          - "fabric-26.2"
          - "neoforge-26.2"
          - "fabric-26.3"
          - "neoforge-26.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"

      - name: Build ${{ matrix.module }}
        env:
          BIOMESUNSEEN_MODULE: ${{ matrix.module }}
        run: |
          set +e
          gradle :${{ matrix.module }}:build -x test --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          mkdir -p ci-errors
          grep -E "error:|Execution failed|What went wrong|^> Task .*FAILED" build.log \
            | head -300 > "ci-errors/${{ matrix.module }}.txt"
          echo "captured $(wc -l < ci-errors/${{ matrix.module }}.txt) lines (exit $code)"
          exit $code

      - name: Upload compiler errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: errs-${{ matrix.module }}
          path: ci-errors/*.txt
          if-no-files-found: ignore

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.module }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish jars to GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: always()
    permissions:
      contents: write
    steps:
      - name: Download all module jars
        uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true

      - name: Collect jars
        run: |
          mkdir -p out
          find jars -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-javadoc.jar' -exec cp -n {} out/ \;
          ls -la out || true

      - name: Create or update release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(out/*.jar)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No jars to publish yet"
            exit 0
          fi
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 "${files[@]}" --clobber
          else
            gh release create v1.0.0 "${files[@]}" --target "$GITHUB_SHA" \
              --title "Biomes Unseen 1.0.0" \
              --notes "Biomes Unseen 1.0.0 - multi-version, multi-loader jars (80 biomes, 20 ores, 30 structures, 25 mobs, 2 bosses, fully animated)."
          fi

  collect:
    name: collect-probe-and-error-reports
    runs-on: ubuntu-latest
    needs: [probe, build]
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/be9e6e99-biomes-unseen
      - uses: actions/download-artifact@v4
        with:
          pattern: probe-*
          merge-multiple: true
          path: raw-probes
      - uses: actions/download-artifact@v4
        with:
          pattern: errs-*
          merge-multiple: true
          path: raw-errors
      - name: Commit reports back to the branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p docs/api-probe docs/ci-errors
          find raw-probes -name 'probe-*.txt' -exec cp {} docs/api-probe/ \;
          find raw-errors -name '*.txt' -exec cp {} docs/ci-errors/ \;
          echo "probe reports: $(ls docs/api-probe | wc -l)"
          echo "error reports: $(ls docs/ci-errors | wc -l)"
          git config user.name "biomesunseen-ci"
          git config user.email "ci@biomesunseen.local"
          git add docs/api-probe docs/ci-errors
          if git diff --cached --quiet; then
            echo "no report changes to commit"
          else
            git commit -m "ci: probe + compiler-error reports for all targets [skip ci]"
            git push origin HEAD:arena/be9e6e99-biomes-unseen
          fi
