            java: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }} (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "${{ matrix.java }}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"

      - name: Build ${{ matrix.module }}
        env:
          BIOMESUNSEEN_MODULE: ${{ matrix.module }}
        run: bash tools/build_module.sh "${{ matrix.module }}"

      - name: Upload compiler errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: errs-${{ matrix.module }}
          path: ci-errors/*.txt
          if-no-files-found: ignore

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.module }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error

  release:
    name: Publish jars to GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() && !contains(github.event.head_commit.message || ' ', '[mirror]') }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all module jars
        uses: actions/download-artifact@v4
        with:
          pattern: jars-*
          path: jars
          merge-multiple: true

      - name: Collect jars
        run: |
          mkdir -p out jars
          find jars -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-javadoc.jar' -exec cp -n {} out/ \; || true
          echo "collected $(ls out | wc -l) jar(s)"
          ls -la out || true
          { echo "run=${GITHUB_RUN_ID} sha=${GITHUB_SHA}"
            echo "--- module jars ---"; find jars -type f -name '*.jar' | sort | head -200
            echo "--- out ---"; ls -la out 2>/dev/null || echo "(no out)"
          } > docs/release-diag.txt; mkdir -p docs; mv docs/release-diag.txt docs/release-diag.txt 2>/dev/null || true

      - name: Create or update release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          shopt -s nullglob
          files=(out/*.jar)
          echo "jar count: ${#files[@]}" | tee -a docs/release-diag.txt
          if [ ${#files[@]} -eq 0 ]; then
            echo "No jars to publish yet" | tee -a docs/release-diag.txt
            exit 0
          fi
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.0 "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY" 2>&1 | tee -a docs/release-diag.txt
          else
            gh release create v1.0.0 "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Biomes Unseen 1.0.0" \
              --notes "Biomes Unseen 1.0.0 - multi-version, multi-loader jars (80 biomes, 20 ores, 30 structures, 25 mobs, 2 bosses, fully animated)." 2>&1 | tee -a docs/release-diag.txt
          fi
          echo "=== release assets ==="
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>&1 | tee -a docs/release-diag.txt

      - name: Publish release diagnostics
        if: always()
        run: |
          mkdir -p docs
          touch docs/release-diag.txt
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add -f docs/release-diag.txt
          git commit -m "ci: release diagnostics [skip ci]" || true
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

  collect:
    name: collect-probe-and-error-reports
    runs-on: ubuntu-latest
    needs: [probe, build, neoforge-config]
    if: ${{ always() && !contains(github.event.head_commit.message || ' ', '[mirror]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: probe-*
          merge-multiple: true
          path: raw-probes
      - uses: actions/download-artifact@v4
        with:
          pattern: errs-*
          merge-multiple: true
          path: raw-errors
      - uses: actions/download-artifact@v4
        with:
          pattern: neoforge-cfg-*
          merge-multiple: true
          path: raw-probes
      - name: Commit reports back to the branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p docs/api-probe docs/ci-errors
          find raw-probes -name 'probe-*.txt' -exec cp {} docs/api-probe/ \;
          find raw-errors -name '*.txt' -exec cp {} docs/ci-errors/ \;
          echo "probe reports: $(ls docs/api-probe | wc -l)"
          echo "error reports: $(ls docs/ci-errors | wc -l)"
          git config user.name "biomesunseen-ci"
          git config user.email "ci@biomesunseen.local"
          git add docs/api-probe docs/ci-errors
          if git diff --cached --quiet; then
            echo "no report changes to commit"
          else
            git commit -m "ci: probe + compiler-error reports for all targets [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  # Transport job: on a commit message tagged [mirror], skip the matrix and
  # copy the already-published v1.0.0 jars into the branch tree so a client
  # without CDN access can fetch them over plain git.
  mirror-jars:
    name: Mirror release jars into branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[mirror]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download published v1.0.0 jars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          rm -rf jars/v1.0.0
          mkdir -p jars/v1.0.0
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern '*.jar' --dir jars/v1.0.0
          echo "jar count: $(ls jars/v1.0.0/*.jar | wc -l)"
          (cd jars/v1.0.0 && sha256sum *.jar > SHA256SUMS.txt)
          ls -la jars/v1.0.0 | head -8
      - name: Commit jars into the branch
        run: |
          set -e
          git config user.name "biomesunseen-ci"
          git config user.email "ci@biomesunseen.local"
          git add -f jars/v1.0.0
          git commit -m "ci: mirror v1.0.0 release jars into branch tree [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
