            java: 21
          - module: "fabric-1.21.11"
            java: 21
          - module: "neoforge-1.21.11"
            java: 21
          - module: "fabric-26.1"
            java: 25
          - module: "neoforge-26.1"
            java: 25
          - module: "fabric-26.1.1"
            java: 25
          - module: "neoforge-26.1.1"
            java: 25
          - module: "fabric-26.1.2"
            java: 25
          - module: "neoforge-26.1.2"
            java: 25
          - module: "fabric-26.2"
            java: 25
          - module: "neoforge-26.2"
            java: 25
          - module: "fabric-26.3"
            java: 25
          - module: "neoforge-26.3"
            java: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }} (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "${{ matrix.java }}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"

      - name: Pin NeoForge to a build that publishes userdev
        run: |
          case "${{ matrix.module }}" in
            neoforge-*) bash tools/pin_neoforge.sh "${{ matrix.module }}" ;;
            *) echo "not a neoforge module, nothing to pin" ;;
          esac

      - name: Build ${{ matrix.module }}
        env:
          BIOMESUNSEEN_MODULE: ${{ matrix.module }}
        run: |
          set +e
          gradle :${{ matrix.module }}:build -x test --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          mkdir -p ci-errors
          out="ci-errors/${{ matrix.module }}.txt"
          : > "$out"
          grep -n -E "error:|Execution failed|What went wrong|FAILED" build.log > hits.txt
          cut -d: -f1 hits.txt | head -60 | while read -r ln; do
            sed -n "$((ln)),$((ln+2))p" build.log >> "$out"
            echo "---" >> "$out"
          done
          # Configuration failures (Loom/provider bugs) only reveal their cause
          # through the stack trace, so keep the first frames of every trace.
          {
            echo "=== STACKTRACE ==="
            grep -E "Caused by:|^	at (net\.fabricmc|dev\.architectury|net\.neoforged|net\.minecraftforge)\." build.log | head -60
            echo "=== WHAT WENT WRONG ==="
            sed -n "/\* What went wrong:/,/^\* Try:/p" build.log | head -40
            echo "=== LAST 40 ==="
            tail -40 build.log
          } >> "$out"
          echo "captured $(wc -l < $out) lines (exit $code)"
          exit $code

      - name: Upload compiler errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: errs-${{ matrix.module }}
          path: ci-errors/*.txt
          if-no-files-found: ignore

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.module }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error

  release:
    name: Publish jars to GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: always()
    permissions:
      contents: write
    steps:
      - name: Download all module jars
        uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true

      - name: Collect jars
        run: |
          mkdir -p out jars
          find jars -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-javadoc.jar' -exec cp -n {} out/ \; || true
          echo "collected $(ls out | wc -l) jar(s)"
          ls -la out || true

      - name: Create or update release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(out/*.jar)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No jars to publish yet"
            exit 0
          fi
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 "${files[@]}" --clobber
          else
            gh release create v1.0.0 "${files[@]}" --target "$GITHUB_SHA" \
              --title "Biomes Unseen 1.0.0" \
              --notes "Biomes Unseen 1.0.0 - multi-version, multi-loader jars (80 biomes, 20 ores, 30 structures, 25 mobs, 2 bosses, fully animated)."
          fi
          echo "=== release assets ==="
          gh release view v1.0.0 --json assets --jq '.assets[].name'

  collect:
    name: collect-probe-and-error-reports
    runs-on: ubuntu-latest
    needs: [probe, build, neoforge-config]
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: probe-*
          merge-multiple: true
          path: raw-probes
      - uses: actions/download-artifact@v4
        with:
          pattern: errs-*
          merge-multiple: true
          path: raw-errors
      - uses: actions/download-artifact@v4
        with:
          pattern: neoforge-cfg-*
          merge-multiple: true
          path: raw-probes
      - name: Commit reports back to the branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p docs/api-probe docs/ci-errors
          find raw-probes -name 'probe-*.txt' -exec cp {} docs/api-probe/ \;
          find raw-errors -name '*.txt' -exec cp {} docs/ci-errors/ \;
          echo "probe reports: $(ls docs/api-probe | wc -l)"
          echo "error reports: $(ls docs/ci-errors | wc -l)"
          git config user.name "biomesunseen-ci"
          git config user.email "ci@biomesunseen.local"
          git add docs/api-probe docs/ci-errors
          if git diff --cached --quiet; then
            echo "no report changes to commit"
          else
            git commit -m "ci: probe + compiler-error reports for all targets [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
