name: Build all targets

on:
  push:
    branches: ["arena/be9e6e99-biomes-unseen"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        module:
          - "fabric-1.16.5"
          - "forge-1.16.5"
          - "fabric-1.17.1"
          - "forge-1.17.1"
          - "fabric-1.18.1"
          - "forge-1.18.1"
          - "fabric-1.18.2"
          - "forge-1.18.2"
          - "fabric-1.19"
          - "forge-1.19"
          - "fabric-1.19.1"
          - "forge-1.19.1"
          - "fabric-1.19.2"
          - "forge-1.19.2"
          - "fabric-1.19.3"
          - "forge-1.19.3"
          - "fabric-1.19.4"
          - "forge-1.19.4"
          - "fabric-1.20"
          - "forge-1.20"
          - "fabric-1.20.1"
          - "forge-1.20.1"
          - "fabric-1.20.2"
          - "neoforge-1.20.2"
          - "fabric-1.20.3"
          - "neoforge-1.20.3"
          - "fabric-1.20.4"
          - "neoforge-1.20.4"
          - "fabric-1.20.5"
          - "neoforge-1.20.5"
          - "fabric-1.20.6"
          - "neoforge-1.20.6"
          - "fabric-1.21"
          - "neoforge-1.21"
          - "fabric-1.21.1"
          - "neoforge-1.21.1"
          - "fabric-1.21.2"
          - "neoforge-1.21.2"
          - "fabric-1.21.3"
          - "neoforge-1.21.3"
          - "fabric-1.21.4"
          - "neoforge-1.21.4"
          - "fabric-1.21.5"
          - "neoforge-1.21.5"
          - "fabric-1.21.6"
          - "neoforge-1.21.6"
          - "fabric-1.21.7"
          - "neoforge-1.21.7"
          - "fabric-1.21.8"
          - "neoforge-1.21.8"
          - "fabric-1.21.9"
          - "neoforge-1.21.9"
          - "fabric-1.21.10"
          - "neoforge-1.21.10"
          - "fabric-1.21.11"
          - "neoforge-1.21.11"
          - "fabric-26.1"
          - "neoforge-26.1"
          - "fabric-26.1.1"
          - "neoforge-26.1.1"
          - "fabric-26.1.2"
          - "neoforge-26.1.2"
          - "fabric-26.2"
          - "neoforge-26.2"
          - "fabric-26.3"
          - "neoforge-26.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"

      - name: Build ${{ matrix.module }}
        run: gradle :${{ matrix.module }}:build -x test --stacktrace --no-daemon
        env:
          BIOMESUNSEEN_MODULE: ${{ matrix.module }}

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.module }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish jars to GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: always()
    permissions:
      contents: write
    steps:
      - name: Download all module jars
        uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true

      - name: Collect jars
        run: |
          mkdir -p out
          find jars -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-javadoc.jar' -exec cp -n {} out/ \;
          ls -la out || true

      - name: Create or update release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(out/*.jar)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No jars to publish yet"
            exit 0
          fi
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 "${files[@]}" --clobber
          else
            gh release create v1.0.0 "${files[@]}" --target "$GITHUB_SHA" \
              --title "Biomes Unseen 1.0.0" \
              --notes "Biomes Unseen 1.0.0 - multi-version, multi-loader jars (80 biomes, 20 ores, 30 structures, 25 mobs, 2 bosses, fully animated)."
          fi
