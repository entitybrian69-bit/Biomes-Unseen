# Build Biomes Unseen (Minecraft 1.20.1 / Forge 47.x)
#
# Compiles the mod with ForgeGradle and uploads the resulting reobfuscated
# jar as the "biomesunseen-jar" artifact. Data generation is run first but is
# non-fatal: if a datagen provider misbehaves we still want the compiled jar.
#
# When the build fails, the tail of the Gradle output is committed back as
# ci-diagnostics.md so the errors can be read from environments that cannot
# reach the Actions log blob storage.

name: Build Biomes Unseen

on:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'ci-diagnostics.md'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run generators
        run: python tools/gen_all.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Run data generation
        continue-on-error: true
        run: gradle runData --no-daemon 2>&1 | tee datagen.log

      - name: Build jar
        id: build
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload built jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biomesunseen-jar
          path: build/libs/*.jar
          if-no-files-found: warn

      - name: Publish diagnostics on failure
        if: failure()
        run: |
          {
            echo "# CI build diagnostics"
            echo
            echo "## data generation (tail)"
            echo '```'
            tail -n 80 datagen.log 2>/dev/null
            echo '```'
            echo
            echo "## build errors"
            echo '```'
            grep -n -iE "error:|cannot find symbol|FAILURE:|What went wrong|Could not (find|resolve)|Execution failed" build.log 2>/dev/null | head -120
            echo '```'
            echo
            echo "## build log (tail)"
            echo '```'
            tail -n 220 build.log 2>/dev/null
            echo '```'
          } > ci-diagnostics.md
          cat ci-diagnostics.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-diagnostics.md
          git commit -m "Publish CI build diagnostics [skip ci]" || true
          git push || true
