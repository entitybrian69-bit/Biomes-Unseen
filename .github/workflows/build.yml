# Build Biomes Unseen (Minecraft 1.20.1 / Forge 47.x)
#
# Compiles the mod with ForgeGradle, runs data generation, and produces the
# reobfuscated jar. The jar and a diagnostics report are committed back into
# the repo (as dist/ and ci-diagnostics.md) so they can be retrieved from
# environments that cannot reach Actions log/artifact blob storage.
#
# Those two paths are in paths-ignore and the publish commit is tagged
# [skip ci], so publishing never re-triggers this workflow.

name: Build Biomes Unseen

on:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'ci-diagnostics.md'
      - 'dist/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run generators
        run: python tools/gen_all.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Run data generation
        id: datagen
        continue-on-error: true
        run: gradle runData --no-daemon 2>&1 | tee datagen.log

      - name: Build jar
        id: build
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log

      - name: Upload built jar (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biomesunseen-jar
          path: build/libs/*.jar
          if-no-files-found: warn

      - name: Publish results to repo
        if: always()
        run: |
          set +e
          {
            echo "# CI build results"
            echo
            echo "- datagen outcome: ${{ steps.datagen.outcome }}"
            echo "- build outcome: ${{ steps.build.outcome }}"
            echo
            echo "## data generation log (tail)"
            echo '```'
            tail -n 160 datagen.log 2>/dev/null
            echo '```'
            echo
            echo "## build log (errors + tail)"
            echo '```'
            grep -n -A4 -E "error:|FAILURE:|What went wrong|Execution failed|Exception|Caused by" build.log 2>/dev/null | head -220
            echo '----- build log tail -----'
            tail -n 45 build.log 2>/dev/null
            echo '```'
            echo
            echo "## generated resources"
            echo '```'
            find src/generated -type f 2>/dev/null | head -40
            echo "count: $(find src/generated -type f 2>/dev/null | wc -l)"
            echo '```'
            echo
            echo "## built jars"
            echo '```'
            ls -la build/libs 2>/dev/null
            echo '```'
          } > ci-diagnostics.md

          mkdir -p dist
          rm -f dist/*.jar
          for j in build/libs/*.jar; do
            if [ -f "$j" ]; then cp "$j" dist/; fi
          done
          ls -la dist 2>/dev/null

          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-diagnostics.md
          git add -f dist 2>/dev/null
          git commit -m "Publish CI results and jar [skip ci]" || echo "nothing to commit"
          git push || true
