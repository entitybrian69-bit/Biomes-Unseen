# Build Biomes Unseen (Minecraft 1.20.1 / Forge 47.x)
#
# Compiles the mod with ForgeGradle and uploads the resulting reobfuscated
# jar as the "biomesunseen-jar" artifact. Data generation is run first but is
# non-fatal: if a datagen provider misbehaves we still want the compiled jar.

name: Build Biomes Unseen

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A new push supersedes an in-flight build for the same branch. Iteration here
# is a fix-compile-push loop, so finishing an outdated run has no value.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run generators
        run: python tools/gen_all.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Run data generation
        continue-on-error: true
        run: gradle runData --no-daemon

      - name: Build jar
        run: gradle build --no-daemon

      - name: Upload built jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biomesunseen-jar
          path: build/libs/*.jar
          if-no-files-found: warn
