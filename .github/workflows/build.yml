          - module: "neoforge-26.3"
            java: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "${{ matrix.java }}"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"
      - name: Dump API surface
        env:
          BIOMESUNSEEN_MODULE: ${{ matrix.module }}
        run: bash tools/ci_probe.sh "${{ matrix.module }}"
      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.module }}
          path: probe-*.txt
          if-no-files-found: error

  # NeoForge configuration experiment: the neoforge modules fail during Gradle
  # configuration, so each variant tries one change to the module build script.
  neoforge-config:
    name: neoforge-cfg-${{ matrix.variant }}
    if: ${{ !contains(github.event.head_commit.message || ' ', '[mirror]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: ["baseline", "no-mappings", "no-java-plugin", "no-architectury", "settings-platform"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"
      - name: Apply variant and probe
        env:
          BIOMESUNSEEN_MODULE: neoforge-1.21.1
        run: |
          set +e
          M=neoforge-1.21.1
          case "${{ matrix.variant }}" in
            no-mappings)     sed -i '/officialMojangMappings/d' $M/build.gradle ;;
            no-java-plugin)  sed -i '/id "java"/d' $M/build.gradle ;;
            no-architectury) sed -i '/dev.architectury:architectury/d' $M/build.gradle ;;
            settings-platform) sed -i 's/^loom.platform=.*/loom.platform=neoforge/' $M/gradle.properties ;;
          esac
          echo "=== variant ${{ matrix.variant }} ==="
          bash tools/ci_probe.sh "$M" "probe-nf-${{ matrix.variant }}.txt"
          grep -m6 -E "MCJAR=|What went wrong|Failed to setup|Could not|PRESENT net.minecraft.world.item.ArmorMaterial" "probe-nf-${{ matrix.variant }}.txt"
      - name: Upload variant report
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-cfg-${{ matrix.variant }}
          path: probe-nf-*.txt
          if-no-files-found: ignore

  build:
    name: ${{ matrix.module }}
    if: ${{ !contains(github.event.head_commit.message || ' ', '[mirror]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        include:
          - module: "fabric-1.16.5"
            java: 21
          - module: "forge-1.16.5"
            java: 21
          - module: "fabric-1.17.1"
            java: 21
          - module: "forge-1.17.1"
            java: 21
          - module: "fabric-1.18.1"
            java: 21
          - module: "forge-1.18.1"
            java: 21
          - module: "fabric-1.18.2"
            java: 21
          - module: "forge-1.18.2"
            java: 21
          - module: "fabric-1.19"
            java: 21
          - module: "forge-1.19"
            java: 21
          - module: "fabric-1.19.1"
            java: 21
          - module: "forge-1.19.1"
            java: 21
          - module: "fabric-1.19.2"
            java: 21
          - module: "forge-1.19.2"
            java: 21
          - module: "fabric-1.19.3"
            java: 21
          - module: "forge-1.19.3"
            java: 21
          - module: "fabric-1.19.4"
            java: 21
          - module: "forge-1.19.4"
            java: 21
          - module: "fabric-1.20"
            java: 21
          - module: "forge-1.20"
            java: 21
          - module: "fabric-1.20.1"
            java: 21
          - module: "forge-1.20.1"
            java: 21
          - module: "fabric-1.20.2"
            java: 21
          - module: "neoforge-1.20.2"
            java: 21
          - module: "fabric-1.20.3"
            java: 21
          - module: "neoforge-1.20.3"
            java: 21
          - module: "fabric-1.20.4"
            java: 21
          - module: "neoforge-1.20.4"
            java: 21
          - module: "fabric-1.20.5"
            java: 21
          - module: "neoforge-1.20.5"
            java: 21
          - module: "fabric-1.20.6"
            java: 21
          - module: "neoforge-1.20.6"
            java: 21
          - module: "fabric-1.21"
            java: 21
          - module: "neoforge-1.21"
            java: 21
          - module: "fabric-1.21.1"
            java: 21
          - module: "neoforge-1.21.1"
