// Biomes Unseen - root build script.
// Each subproject (fabric-*, forge-*, neoforge-*) is a standalone Architectury
// Loom module targeting one Minecraft version and one loader.  The shared
// content lives in common/ and is compiled into every module as extra sources.

allprojects {
    group = project.mod_group
    version = project.mod_version

    repositories {
        mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://maven.neoforged.net/releases" }
        maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://maven.terraformersmc.com/releases" }
        maven { url = "https://oss.sonatype.org/content/repositories/snapshots/" }
    }
}

subprojects {
    apply plugin: "java"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.target_java))
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        // javac stops at 100 errors per compilation; the CI reports are the
        // only compiler output visible for a failing module, so ask for the
        // whole error list instead of the first screenful.
        options.compilerArgs += ["-Xmaxerrs", "2000"]
        def target = Integer.parseInt(project.target_java)
        if (target >= 9) {
            options.release = target
        } else {
            // javac 8 has no --release flag; classic source/target instead.
            sourceCompatibility = "1." + project.target_java
            targetCompatibility = "1." + project.target_java
        }
    }

    // pack.mcmeta and the mod metadata files can appear in more than one of
    // the configured resource roots (module-local, common, generated).  Every
    // copy task must therefore say what to do about duplicates: Gradle 9 fails
    // the build outright otherwise.  EXCLUDE keeps the first (module-local)
    // entry, which is the loader-specific one.
    tasks.withType(AbstractCopyTask).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    tasks.withType(ProcessResources).configureEach {
        def props = [
                version          : project.mod_version,
                mod_version      : project.mod_version,
                mod_id           : project.mod_id,
                mod_name         : project.mod_name,
                minecraft_version: project.minecraft_version
        ]
        inputs.properties props
        filesMatching(["META-INF/mods.toml", "META-INF/neoforge.mods.toml", "fabric.mod.json"]) {
            expand props
        }
    }
}
