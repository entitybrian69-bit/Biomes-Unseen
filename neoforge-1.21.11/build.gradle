plugins {
    id "dev.architectury.loom" version "1.17.493"
    id "java"
}

base {
    archivesName = "biomesunseen-1.21.11-neoforge"
}

// Shared content trees: core + this API line.
sourceSets.main.java.srcDirs += rootProject.file("common/src/main/java")
sourceSets.main.java.srcDirs += rootProject.file("common/src/line-1.21.9/java")
sourceSets.main.resources.srcDirs += rootProject.file("common/src/main/resources")
sourceSets.main.resources.srcDirs += rootProject.file("common/src/line-1.21.9/resources")
sourceSets.main.resources.srcDirs += "src/generated/resources"

loom {
    // no mixin config needed
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    neoForge "net.neoforged:neoforge:${neoforge_version}"
    modImplementation "dev.architectury:architectury:${architectury_version}"
    modImplementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:4.7.5"
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

tasks.register("runDatagen", JavaExec) {
    group = "biomesunseen"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "com.biomesunseen.datagen.DataGenerators"
    args = ["src/generated/resources"]
}
